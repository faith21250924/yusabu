<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUSABU | Bitcoin</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

overflow:hidden;
background:#000;
font-family:'Orbitron',sans-serif;
}

canvas{
position:fixed;
top:0;
left:0;
}

.content{

position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
color:white;
z-index:100;

}

h1{

font-size:70px;
color:#f2b705;
text-shadow:0 0 30px gold;

}

h2{

font-size:25px;
margin-top:20px;
font-weight:300;

}

button{

margin-top:40px;
padding:15px 35px;
font-size:20px;
background:rgba(255,255,255,.1);
color:white;
border:1px solid rgba(255,255,255,.3);
backdrop-filter:blur(10px);
cursor:pointer;
transition:.3s;

}

button:hover{

background:#f2b705;
color:black;
transform:scale(1.08);

}

</style>

</head>

<body>

<canvas id="space"></canvas>

<div class="content">

<h1>₿ YUSABU</h1>

<h2>Bitcoin • Freedom • Long Term</h2>

<button onclick="window.open('https://www.tradingview.com')">
BTC Chart
</button>

</div>

<script>

const canvas=document.getElementById("space");

const c=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];

for(let i=0;i<350;i++){

stars.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

r:Math.random()*2,

s:Math.random()*0.5+0.2

})

}

let mouse={x:0,y:0};

window.addEventListener("mousemove",e=>{

mouse.x=e.clientX;
mouse.y=e.clientY;

});

function draw(){

c.fillStyle="black";
c.fillRect(0,0,canvas.width,canvas.height);

c.fillStyle="white";

stars.forEach(st=>{

c.beginPath();
c.arc(st.x,st.y,st.r,0,Math.PI*2);
c.fill();

st.y+=st.s;

if(st.y>canvas.height){

st.y=0;

st.x=Math.random()*canvas.width;

}

});

c.fillStyle="gold";

c.beginPath();

c.arc(mouse.x,mouse.y,3,0,Math.PI*2);

c.fill();

requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>
